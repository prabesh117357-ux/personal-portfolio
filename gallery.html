<!DOCTYPE html>
<html>

<head>
    <title>My Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .main {
            width: 90%;
            margin: 30px auto;
            border: 2px solid black;
            background: white;
        }

        .top {
            display: flex;
            align-items: center;
            height: 80px;
            border-bottom: 2px solid black;
        }

        .logo {
            width: 25%;
            text-align: center;
        }

        .menu {
            width: 75%;
            display: flex;
            justify-content: space-around;
        }

        .menu div {
            padding: 10px 20px;
            border: 1px solid black;
        }

        .menu div a {
            text-decoration: none;
            color: black;
        }

        .gallery-section {
            padding: 20px;
            border-top: 2px solid black;
        }

        .gallery {
            display: grid;
            grid-template-columns: 30% repeat(5, 1fr);
            gap: 12px;
            height: 420px;
        }

        .image-box {
            border: 2px solid black;
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        .image-box:nth-child(1) {
            background-image: url('https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=900&q=80');
        }

        .image-box:nth-child(2) {
            background-image: url('https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=900&q=80');
        }

        .image-box:nth-child(3) {
            background-image: url('https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=80');
        }

        .image-box:nth-child(4) {
            background-image: url('https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=900&q=80');
        }

        .image-box:nth-child(5) {
            background-image: url('https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=900&q=80');
        }

        .image-box:nth-child(6) {
            background-image: url('https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80');
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="top">
            <div class="logo">
                <h2>LOGO</h2>
            </div>

            <div class="menu">
                <div><a href="index.html">Home</a></div>
                <div><a href="about.html">About</a></div>
                <div><a href="service.html">Service</a></div>
                <div><a href="contact.html">Contact</a></div>
            </div>
        </div>

        <div class="gallery-section">
            <div class="gallery">
                <div class="image-box"></div>
                <div class="image-box"></div>
                <div class="image-box"></div>
                <div class="image-box"></div>
                <div class="image-box"></div>
                <div class="image-box"></div>
            </div>
        </div>

    </div>

</body>

</html>
